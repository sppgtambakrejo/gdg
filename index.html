<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050506">
<title>No more.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #050506;
    --ash: #7d7a78;
    --bone: #d4cdc3;
    --rust: #3a0b0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); }
  body {
    color: var(--bone);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Vignette + grain */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(58,11,11,.28) 0%, rgba(5,5,6,0) 55%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%);
  }
  body::after {
    content: "";
    position: fixed; inset: -50%; pointer-events: none; z-index: 2;
    opacity: .09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); }
    20% { transform: translate(-3%,2%); }
    40% { transform: translate(2%,-3%); }
    60% { transform: translate(-2%,-1%); }
    80% { transform: translate(3%,3%); }
    100% { transform: translate(0,0); }
  }

  main {
    position: relative; z-index: 3;
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
  }
  .verse {
    max-width: 34rem;
    text-align: center;
    font-weight: 300;
    font-size: clamp(1.45rem, 5.2vw, 2.35rem);
    line-height: 1.55;
    letter-spacing: .01em;
    opacity: 0;
    transition: opacity 4s ease;
  }
  body.entered .verse { opacity: 1; }
  .line { display: block; margin-bottom: 1.1em; }
  .line:first-child { font-weight: 500; }
  .line:last-child { color: var(--ash); font-style: italic; margin-bottom: 0; }

  /* The tremble: each word shakes slightly on its own rhythm */
  .w {
    display: inline-block;
    animation: tremble var(--d, .9s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes tremble {
    0%   { transform: translate(0,0) rotate(0); }
    20%  { transform: translate(var(--x1,.6px), var(--y1,-.5px)) rotate(.15deg); }
    45%  { transform: translate(var(--x2,-.5px), var(--y2,.4px)) rotate(-.2deg); }
    70%  { transform: translate(var(--x3,.4px), var(--y3,.6px)) rotate(.1deg); }
    100% { transform: translate(0,0) rotate(0); }
  }

  /* Entry gate (needed because browsers block autoplay audio) */
  #gate {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink);
    color: var(--ash);
    font-family: inherit; font-size: 1.25rem; font-style: italic; letter-spacing: .12em;
    border: 0; cursor: pointer; width: 100%;
    transition: opacity 2.5s ease, visibility 0s 2.5s;
  }
  #gate span { animation: breathe 3.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  body.entered #gate { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate:focus-visible, #mute:focus-visible { outline: 1px solid var(--ash); outline-offset: 6px; }

  #mute {
    position: fixed; z-index: 5;
    right: max(1.1rem, env(safe-area-inset-right));
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    background: none; border: 0; cursor: pointer;
    color: var(--ash); font-family: inherit; font-size: 1rem; font-style: italic;
    opacity: 0; transition: opacity 4s ease 2s;
    padding: .5rem;
  }
  body.entered #mute { opacity: .6; }
  #mute:hover { opacity: 1; }

  /* Exhaustion: the whole verse sags like a long sigh */
  .verse { animation: sigh 9s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes sigh {
    0%, 100% { transform: scale(1) translateY(0); }
    55% { transform: scale(.982) translateY(5px); }
  }

  /* Anger: the first line snaps, glitches, bleeds red - then goes quiet again */
  .line:first-child { animation: rage 7s steps(1, end) infinite; }
  @keyframes rage {
    0%, 91%, 100% { transform: none; text-shadow: none; color: var(--bone); }
    92% { transform: translate(-4px, 1px) skewX(-5deg); text-shadow: 4px 0 #9b1111, -4px 0 #1b3550; color: #f0d9d3; }
    93% { transform: translate(5px, -2px) skewX(4deg); text-shadow: -5px 0 #9b1111, 5px 0 #1b3550; }
    94% { transform: translate(-2px, 2px) skewX(-2deg); text-shadow: 3px 1px #c01515, -3px -1px #1b3550; color: #f0d9d3; }
    95% { transform: translate(3px, 0); text-shadow: 2px 0 #9b1111; }
    96% { transform: none; text-shadow: none; color: var(--bone); }
  }
  #rage {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(150,14,14,.5), rgba(60,0,0,.15) 60%, rgba(0,0,0,0) 80%);
    opacity: 0;
    animation: rageflash 7s steps(1, end) infinite;
  }
  @keyframes rageflash {
    0%, 91%, 100% { opacity: 0; }
    92% { opacity: .55; }
    93% { opacity: .1; }
    94% { opacity: .45; }
    96% { opacity: .15; }
    97% { opacity: 0; }
  }

  /* Weariness: heavy eyelids fight to close, then jerk back open */
  .lid {
    position: fixed; left: 0; right: 0; z-index: 4; pointer-events: none;
    height: 0; background: #000;
    animation: droop 16s ease-in-out infinite;
  }
  .lid.top { top: 0; background: linear-gradient(#000 70%, rgba(0,0,0,0)); }
  .lid.bot { bottom: 0; background: linear-gradient(rgba(0,0,0,0), #000 30%); animation-name: droop-bot; }
  @keyframes droop {
    0%, 55% { height: 0; }
    70% { height: 30vh; }
    74% { height: 24vh; }
    82% { height: 36vh; }
    86% { height: 0; }
    100% { height: 0; }
  }
  @keyframes droop-bot {
    0%, 55% { height: 0; }
    70% { height: 24vh; }
    74% { height: 19vh; }
    82% { height: 30vh; }
    86% { height: 0; }
    100% { height: 0; }
  }

  /* Falling ash */
  #ash { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* Muttered fragments that surface and sink */
  #whispers { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .whisper {
    position: absolute;
    font-style: italic; font-weight: 300;
    color: var(--ash);
    opacity: 0;
    white-space: nowrap;
    animation: surface 7s ease-in-out forwards, tremble .8s ease-in-out infinite;
    --x1: .5px; --y1: -.4px; --x2: -.5px; --y2: .4px; --x3: .4px; --y3: .5px;
  }
  .whisper.sharp { color: #8a3a35; font-style: normal; letter-spacing: .08em; }
  @keyframes surface {
    0% { opacity: 0; margin-top: 0; }
    30% { opacity: .42; }
    100% { opacity: 0; margin-top: 18px; }
  }

  /* System log: a machine giving up, line by line */
  #log {
    position: fixed; z-index: 3; pointer-events: none;
    left: max(1.1rem, env(safe-area-inset-left));
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    max-width: 62vw;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: .68rem; line-height: 1.7;
    color: #5d5a58;
    opacity: 0; transition: opacity 4s ease 3s;
  }
  body.entered #log { opacity: 1; }
  #log div { animation: logIn .6s steps(8) both; }
  #log div.fatal { color: #8a3a35; }
  @keyframes logIn { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .w, body::after, #gate span, .verse, .line:first-child, #rage, .lid, .whisper { animation: none; }
    .whisper { opacity: .3; }
    .lid, #rage { display: none; }
  }
</style>
</head>
<body>

<button id="gate" type="button" aria-label="Enter"><span>tap to enter</span></button>

<main>
  <p class="verse" id="verse">
    <span class="line">Enough is enough.</span>
    <span class="line">The system has failed, the trust is gone, and nothing remains worth saving.</span>
    <span class="line">Shut it down. Let it go dark.</span>
    <span class="line">No restart. No return. No more.</span>
  </p>
</main>

<canvas id="ash" aria-hidden="true"></canvas>
<div id="whispers" aria-hidden="true"></div>
<div id="log" aria-hidden="true"></div>
<div id="rage" aria-hidden="true"></div>
<div class="lid top" aria-hidden="true"></div>
<div class="lid bot" aria-hidden="true"></div>

<button id="mute" type="button" aria-pressed="false">silence</button>

<div id="yt-holder" aria-hidden="true" style="position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden"></div>

<script>
(function () {
  /* ---------- MUSIC SETTINGS ----------
     Pilih salah satu (kosongkan sisanya):
     1) AUDIO_SRC : path file musik sendiri, mis. "dark.mp3" (paling stabil, disarankan)
     2) YT_ID     : ID video YouTube, mis. "abc123XYZ" (dari youtube.com/watch?v=ID)
     3) Jika dua-duanya kosong, halaman memakai drone gelap buatan (tanpa file). */
  var AUDIO_SRC = "";
  var YT_ID = "";

  /* ---------- Tremble: split text into words with random shake ---------- */
  var rnd = function (a, b) { return (Math.random() * (b - a) + a).toFixed(2); };
  document.querySelectorAll(".line").forEach(function (line) {
    var words = line.textContent.trim().split(/\s+/);
    line.textContent = "";
    words.forEach(function (word, i) {
      var s = document.createElement("span");
      s.className = "w";
      s.textContent = word;
      s.style.setProperty("--d", rnd(0.6, 1.3) + "s");
      s.style.setProperty("--delay", "-" + rnd(0, 1.5) + "s");
      s.style.setProperty("--x1", rnd(-.9, .9) + "px");
      s.style.setProperty("--y1", rnd(-.8, .8) + "px");
      s.style.setProperty("--x2", rnd(-.9, .9) + "px");
      s.style.setProperty("--y2", rnd(-.8, .8) + "px");
      s.style.setProperty("--x3", rnd(-.9, .9) + "px");
      s.style.setProperty("--y3", rnd(-.8, .8) + "px");
      line.appendChild(s);
      if (i < words.length - 1) line.appendChild(document.createTextNode(" "));
    });
  });

  /* ---------- Audio ---------- */
  var ctx, master, fileAudio, muted = false, started = false;

  function startDrone() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 8);

    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 380;
    filter.Q.value = 4;

    // slow breathing of the filter
    var lfo = ctx.createOscillator();
    var lfoGain = ctx.createGain();
    lfo.frequency.value = 0.07;
    lfoGain.gain.value = 170;
    lfo.connect(lfoGain).connect(filter.frequency);
    lfo.start();

    // low minor cluster, slightly detuned so it beats and unsettles
    [55, 55.45, 82.41, 98.0, 110.6, 130.81].forEach(function (f, i) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = i < 3 ? "sawtooth" : "triangle";
      o.frequency.value = f;
      g.gain.value = i < 3 ? 0.16 : 0.07;
      o.connect(g).connect(filter);
      o.start();
    });

    // distant slow pulse
    var pulse = ctx.createGain();
    pulse.gain.value = 1;
    var pl = ctx.createOscillator();
    var plg = ctx.createGain();
    pl.frequency.value = 0.18;
    plg.gain.value = 0.25;
    pl.connect(plg).connect(pulse.gain);
    pl.start();

    filter.connect(pulse).connect(master).connect(ctx.destination);
  }

  function startAudio() {
    if (started) return;
    started = true;
    if (AUDIO_SRC) {
      fileAudio = new Audio(AUDIO_SRC);
      fileAudio.loop = true;
      fileAudio.volume = 0.7;
      fileAudio.play().catch(function () {});
    } else if (YT_ID) {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube.com/embed/" + encodeURIComponent(YT_ID) +
        "?autoplay=1&loop=1&playlist=" + encodeURIComponent(YT_ID) + "&controls=0&playsinline=1";
      f.allow = "autoplay; encrypted-media";
      f.width = 200; f.height = 200;
      f.title = "background music";
      document.getElementById("yt-holder").appendChild(f);
      document.getElementById("mute").style.display = "none";
    } else {
      startDrone();
    }
  }

  /* ---------- Falling ash (exhaustion) ---------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canvas = document.getElementById("ash");
  var c2d = canvas.getContext("2d");
  var flakes = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(110, Math.max(45, W * H / 11000)));
    flakes = [];
    for (var i = 0; i < n; i++) flakes.push(newFlake(true));
  }
  function newFlake(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -10,
      r: Math.random() * 1.6 + .4,
      vy: Math.random() * .35 + .12,
      sw: Math.random() * 1.5 + .3,
      ph: Math.random() * 6.28,
      a: Math.random() * .35 + .1
    };
  }
  function drawAsh(t) {
    c2d.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.vy;
      var x = f.x + Math.sin(t / 2200 + f.ph) * f.sw * 8;
      if (f.y > H + 10) flakes[i] = newFlake(false);
      c2d.beginPath();
      c2d.fillStyle = "rgba(170,165,160," + f.a + ")";
      c2d.arc(x, f.y, f.r, 0, 6.283);
      c2d.fill();
    }
    requestAnimationFrame(drawAsh);
  }
  resize();
  window.addEventListener("resize", resize);
  if (!reduce) requestAnimationFrame(drawAsh);

  /* ---------- Whispers (tired, sick of it, angry) ---------- */
  var fragments = [
    "tired.", "so tired.", "sick of it.", "why bother.", "i'm done.", "no one listened.",
    "again.", "enough.", "i said enough.", "nothing left.", "stop asking.", "heavy.",
    "too long.", "for what.", "i can't.", "worthless.", "no more patience.", "fine. burn it."
  ];
  var sharp = ["ENOUGH.", "I'M DONE.", "STOP.", "NO."];
  var wBox = document.getElementById("whispers");

  function whisper() {
    var el = document.createElement("span");
    var angry = Math.random() < .18;
    el.className = "whisper" + (angry ? " sharp" : "");
    var list = angry ? sharp : fragments;
    el.textContent = list[Math.floor(Math.random() * list.length)];
    el.style.left = (4 + Math.random() * 66) + "%";
    el.style.top = (6 + Math.random() * 84) + "%";
    el.style.fontSize = (angry ? 1 : 1 + Math.random() * .7) + "rem";
    el.style.transform = "rotate(" + ((Math.random() - .5) * 8).toFixed(1) + "deg)";
    wBox.appendChild(el);
    setTimeout(function () { el.remove(); }, 7200);
    setTimeout(whisper, 2200 + Math.random() * 3200);
  }

  /* ---------- System log (a machine giving up) ---------- */
  var logLines = [
    "error 401: trust revoked",
    "retry 1/\u221e ... failed",
    "support ticket #0 ... ignored",
    "patience: 0%",
    "retry 2/\u221e ... failed",
    "heartbeat: not found",
    "morale: unreachable",
    "retry 3/\u221e ... why",
    "fatal: nobody is coming",
    "exit code 1",
    "exit code 1",
    "exit code 1"
  ];
  var logBox = document.getElementById("log"), logI = 0;
  function logTick() {
    var d = document.createElement("div");
    var txt = logLines[logI % logLines.length];
    d.textContent = "> " + txt;
    if (/fatal|exit/.test(txt)) d.className = "fatal";
    logBox.appendChild(d);
    while (logBox.children.length > 4) logBox.removeChild(logBox.firstChild);
    logI++;
    setTimeout(logTick, 2000 + Math.random() * 2200);
  }

  document.getElementById("gate").addEventListener("click", function () {
    document.body.classList.add("entered");
    startAudio();
    setTimeout(whisper, 3500);
    setTimeout(logTick, 2500);
  });

  document.getElementById("mute").addEventListener("click", function () {
    muted = !muted;
    this.textContent = muted ? "listen" : "silence";
    this.setAttribute("aria-pressed", String(muted));
    if (fileAudio) fileAudio.muted = muted;
    if (ctx) { muted ? ctx.suspend() : ctx.resume(); }
  });
})();
</script>
</body>
</html>
